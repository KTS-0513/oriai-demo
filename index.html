<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>【お試し版】おりあい（仮称）── 2つの視点で検討する</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== [S1] 色と土台（§11：影なし・角6px・ピルなし・色は区分と状態だけ） ===== */
:root{
  --ink:#1f2328; --sub:#59636e; --line:#d0d7de; --bg:#f6f6f3; --paper:#fff;
  --x:#1f6feb; --x-weak:#e3edfd; --y:#c96a12; --y-weak:#fbeedd;
  --ok:#1a7f37; --warn:#9a6700; --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:"BIZ UDPGothic",system-ui,sans-serif;font-size:15px;line-height:1.6}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-size:16px;border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;background:#fff;width:100%}
textarea{resize:vertical;min-height:54px}
input:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
button{cursor:pointer;min-height:40px;border-radius:var(--r);border:1px solid var(--ink);background:#fff;padding:6px 14px}
button.main{background:var(--ink);color:#fff}
button.quiet{border-color:var(--line)}
button:disabled{opacity:.4;cursor:default}
h1,h2,h3{margin:0;line-height:1.35}
.muted{color:var(--sub);font-size:13px}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:3px;padding:0 6px;color:var(--sub)}
.tx{color:var(--x);font-weight:700}.ty{color:var(--y);font-weight:700}
.hide{display:none!important}
.gas .demo-only{display:none!important}
.gas-only{display:none!important}
.gas .gas-only{display:inline-block!important}
#notice{background:#fff1e0;border-bottom:1px solid #e8c9a0;padding:8px 20px;font-size:14px}

/* ===== [S2] 外わく ===== */
header.app{display:flex;align-items:center;gap:16px;padding:8px 20px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
header.app .logo{font-weight:700;font-size:18px}
header.app .logo small{font-weight:400;color:var(--sub);font-size:12px;margin-left:6px}
.demo{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--sub);flex-wrap:wrap}
.demo button{min-height:32px;padding:2px 10px;font-size:13px;border-color:var(--line)}
.demo button.on{border-color:var(--ink);background:var(--ink);color:#fff}
main{max-width:1366px;margin:0 auto;padding:16px 20px}

/* ===== [S3] 生徒：はじめの画面 ===== */
.who{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-bottom:16px}
.who label{font-size:13px;color:var(--sub)}
.who .f{width:90px}.who .n{width:200px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.topic{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;min-height:0;display:flex;flex-direction:column;gap:6px;border-color:var(--line)}
.topic:hover{border-color:var(--ink)}
.topic .axes{font-size:14px}
.topic .state{font-size:12px;color:var(--sub)}

/* ===== [S4] 生徒：書く画面 ===== */
.workhead{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.workhead h2{font-size:18px}
.workhead .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.saved{font-size:12px;color:var(--sub);min-width:120px;text-align:right}
.steps{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.steps button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:6px 14px;white-space:nowrap;color:var(--sub)}
.steps button.on{border-bottom-color:var(--ink);color:var(--ink);font-weight:700}
.steps b{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border:1px solid currentColor;border-radius:3px;font-size:12px;margin-right:6px}
.work{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:16px;align-items:start}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.panel + .panel{margin-top:12px}
.panel h3{font-size:15px;margin-bottom:8px}
.lead{margin:0 0 10px}
.okline{font-size:12px;color:var(--sub);margin:-4px 0 10px}
.axisbox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.axisbox > div{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.axisbox .ax{border-left:4px solid var(--x)}.axisbox .ay{border-left:4px solid var(--y)}
.opt{display:grid;grid-template-columns:30px 1fr 1.6fr 40px;gap:8px;align-items:center;margin-bottom:8px}
.num{font-weight:700;font-size:16px;text-align:center}
.rate{border-top:1px solid var(--line);padding:10px 0}
.rate:first-of-type{border-top:0;padding-top:0}
.rate .row,.cycle .row{display:grid;grid-template-columns:96px auto 1fr;gap:8px;align-items:center;margin-top:6px}
.score{display:flex;gap:4px}
.score button{min-width:40px;min-height:40px;padding:0;border-color:var(--line)}
.score.sx button.on{background:var(--x);border-color:var(--x);color:#fff}
.score.sy button.on{background:var(--y);border-color:var(--y);color:#fff}
.weights{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.weights button{min-height:52px;font-size:13px;line-height:1.3;border-color:var(--line);padding:4px}
.weights button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.bestmsg{margin:10px 0;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:#fafafa}
.choose{display:flex;flex-direction:column;gap:6px}
.choose label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;cursor:pointer;min-height:44px}
.choose label.on{border-color:var(--ink)}
.choose input{width:auto}
.field{margin-top:10px}
.field > span{display:block;font-size:13px;color:var(--sub);margin-bottom:3px}
.nav{display:flex;justify-content:space-between;margin-top:12px}
.done{border:1px solid var(--ok);color:var(--ok);border-radius:3px;font-size:12px;padding:0 6px}

/* ===== [S5] 見え方（地図・天秤・表） ===== */
.viewhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
svg text{font-family:inherit}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--sub);font-weight:400}
.tbl tr.best td{background:#f3f3f0}
.tbl td:nth-child(-n+2){white-space:nowrap}
.tbl .n{text-align:center;font-weight:700}

/* ===== [S6] 記入例・詳細の引き出し ===== */
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.25);display:flex;justify-content:flex-end;z-index:20}
.drawer > div{width:min(560px,100%);height:100%;background:var(--paper);overflow:auto;padding:16px 20px;border-left:1px solid var(--line)}
.drawer .close{float:right}

/* ===== [S7] 先生画面 ===== */
.tgrid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.tlist h2{white-space:nowrap}
.panel svg{max-width:480px;display:block}
.tlist button{display:block;width:100%;text-align:left;border-color:var(--line);margin-bottom:6px;padding:8px 12px}
.tlist button.on{border-color:var(--ink);border-width:2px;padding:7px 11px}
.kpis{display:flex;gap:20px;margin:6px 0 10px;font-size:14px}
.kpis b{font-size:20px}
.cls{display:grid;grid-template-columns:420px minmax(0,1fr);gap:16px;align-items:start}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;align-items:end;height:90px;margin-top:6px}
.bars div{background:var(--ink);min-height:2px;border-radius:2px 2px 0 0}
.barl{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:11px;color:var(--sub);text-align:center;line-height:1.3}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#f3f3f0}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form2 .wide{grid-column:1 / -1}

/* ===== [S16] 開発モード ===== */
.modes{display:flex;border-bottom:1px solid var(--line);margin:-4px 0 14px}
.modes button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 18px;color:var(--sub);font-size:15px}
.modes button.on{border-bottom-color:var(--ink);color:var(--ink);font-weight:700}
.cands{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.cands button{min-height:40px;border-color:var(--line)}
.cands.cx button.on{background:var(--x);border-color:var(--x);color:#fff}
.cands.cy button.on{background:var(--y);border-color:var(--y);color:#fff}
.constraint{border-left:4px solid var(--line);padding:6px 12px;background:#fafafa;margin:10px 0}
.taskbox{border:1px solid var(--ink);border-radius:var(--r);padding:10px 12px;font-size:16px;margin:8px 0}
.checks{list-style:none;padding:0;margin:8px 0 0;font-size:14px}
.checks li{padding:2px 0}.checks .y{color:var(--ok)}.checks .n{color:var(--sub)}
.cycle{border-top:1px solid var(--line);padding:10px 0}
.cycle:first-of-type{border-top:0}
.pair{display:grid;grid-template-columns:1fr 110px 44px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.pbar{background:#ececea;height:10px;border-radius:2px}.pbar div{background:var(--ink);height:100%;border-radius:2px}

/* ===== [S0] デバッグコンソール ===== */
#dbg{position:fixed;left:8px;bottom:8px;z-index:30}
#dbg button{min-height:28px;font-size:12px;padding:2px 8px;border-color:var(--line);background:#fff}
#dbg pre{display:none;max-width:560px;max-height:240px;overflow:auto;background:#fff;border:1px solid var(--line);padding:8px;font-size:12px;white-space:pre-wrap;margin:4px 0 0}
#dbg.open pre{display:block}

@media (max-width:1000px){
  .work,.tgrid,.cls{grid-template-columns:1fr}
  .opt{grid-template-columns:24px 1fr 40px}.opt .note{grid-column:2 / 3}
  .rate .row{grid-template-columns:1fr}
  .axisbox{grid-template-columns:1fr}
  .weights button{font-size:12px}
}
</style>
</head>
<body>
<header class="app">
  <div class="logo">おりあい<small>2つの視点で検討する（仮称・模型）</small></div>
  <div class="demo" id="demo">
    <span class="demo-only">デモ：</span>
    <button class="demo-only" data-role="student">生徒</button><button class="demo-only" data-role="teacher">先生</button>
    <span style="margin-left:8px">見え方：</span>
    <button data-view="map">地図</button><button data-view="balance">天秤</button><button data-view="table">表</button>
    <button class="demo-only" data-reset="1" style="margin-left:8px">見本データを入れ直す</button>
    <button class="gas-only" id="teacherBtn" type="button" style="margin-left:8px">先生の方はこちら</button>
  </div>
</header>
<div id="notice" class="hide"></div>
<div style="background:#fff8e1;border-bottom:1px solid #e6d9a8;padding:6px 20px;font-size:13px;line-height:1.5"><b>お試し版（見本データ）</b>　書いたものはこのブラウザの中だけに保存され、どこにも送られません。右上の「デモ」で生徒と先生を切りかえ、「見本データを入れ直す」で最初に戻ります。<span style="color:#59636e">（版 2026/11/8 22:45:19）</span></div>
<main id="app"></main>
<div id="drawer"></div>
<div id="dbg"><button type="button" onclick="this.parentNode.classList.toggle('open')">ログ</button><pre id="dbglog"></pre></div>

<script>
/* ===== [S0] 画面内デバッグコンソール（Chromebook は検証ツールが開けないため） ===== */
var DBG = [];
function dlog(m){ DBG.push(new Date().toLocaleTimeString() + ' ' + m); var p = document.getElementById('dbglog'); if (p) p.textContent = DBG.slice(-80).join('\n'); }
window.onerror = function(msg, src, line){ dlog('エラー: ' + msg + ' (' + line + ')'); };

/* ===== [S8] 見本データ（実名は使わない） ===== */
const SEED_TOPICS = [
  { topicId:'T1', title:'自転車用ヘルメット', kind:'評価', classCode:'', open:true,
    scene:'毎日の自転車通学でかぶるヘルメットを選ぶ。お店には形のちがうヘルメットが並んでいる。',
    axisX:'安全性', hintX:'ころんだり、ぶつかったりしたときに頭を守れるか',
    axisY:'快適さ', hintY:'重さ・むれにくさ・かぶりたくなるか',
    example:{ options:[
      {name:'かたい殻のフルタイプ', note:'厚いクッション。通気の穴は少ない', x:5, y:2, whyX:'頭の横までおおっていて、殻もかたい', whyY:'重くて夏はむれる'},
      {name:'穴の多い軽いタイプ', note:'ロードバイク用に近い形', x:3, y:4, whyX:'殻はあるが、穴が多いぶん弱そう', whyY:'軽くて風が通る'},
      {name:'帽子型', note:'見た目はふつうの帽子', x:2, y:5, whyX:'中にクッションが入っているだけ', whyY:'見た目が気にならず、毎日かぶれる'}],
      user:'中1の自分', situation:'片道20分・坂道と交差点が多い通学路', weight:0.75, chosen:0,
      reason:'坂道で速度が出るので、安全性を重く見た。重さはがまんできる', idea:'殻の形はそのままで、穴の位置を工夫すれば快適さも上げられそう' } },
  { topicId:'T2', title:'机に置く本立て', kind:'設計', classCode:'', open:true,
    scene:'自分の机に置く本立てを木材でつくる。教科書・ノート・辞書を入れたい。',
    axisX:'安全性', hintX:'倒れないか・角や板で手をけがしないか',
    axisY:'収納の多さ', hintY:'入れたいものがどれだけ入るか',
    example:{ options:[
      {name:'背の高い3段', note:'高さ60cm・奥行き15cm', x:2, y:5, whyX:'背が高いのに奥行きが浅く、地震で倒れそう', whyY:'教科書もノートも全部入る'},
      {name:'低い2段＋広い底板', note:'高さ35cm・底板を前に出す', x:4, y:3, whyX:'重心が低く、底板が広いので倒れにくい', whyY:'辞書が1冊入らない'},
      {name:'1段＋角を丸める', note:'高さ20cm', x:5, y:1, whyX:'倒れようがない。角も丸い', whyY:'教科書しか入らない'}],
      user:'机で勉強する自分', situation:'地震のときも机の前にいることがある', weight:0.5, chosen:1,
      reason:'半々だと①と②が同じ点になった。倒れたときのけがの方が困るので②にした', idea:'背の高い形でも、壁や机に固定する金具を付ければ両方を上げられる' } },
  { topicId:'T3', title:'スマホの画面ロック', kind:'評価', classCode:'', open:true,
    scene:'家族のスマホに、どんな画面ロックを設定するのがよいかを考える。',
    axisX:'安全性', hintX:'なくしたとき・ぬすまれたときに中を見られないか',
    axisY:'使いやすさ', hintY:'開くまでの手間・覚えやすさ',
    example:{ options:[
      {name:'ロックなし', note:'画面をさわるだけで開く', x:1, y:5, whyX:'拾った人がだれでも見られる', whyY:'すぐ開ける'},
      {name:'4けたの暗証番号', note:'', x:3, y:4, whyX:'当てるのは少しむずかしい', whyY:'4けたなら覚えられる'},
      {name:'長い英数字のパスワード', note:'12文字以上', x:5, y:1, whyX:'当てられる心配がほとんどない', whyY:'毎回打つのが大変で、忘れそう'}],
      user:'祖母', situation:'電話と写真を見るのに毎日使う', weight:0.25, chosen:1,
      reason:'点だけなら「ロックなし」になったが、なくしたら写真や連絡先を見られてしまう。4けたなら覚えられると言っていた', idea:'指紋や顔で開けるしくみなら、両方を上げられるかもしれない' } }
];
const NAMES = ['見本 あおい','見本 いつき','見本 うみ','見本 えいた','見本 おとは','見本 かなた','見本 きよら','見本 くうが','見本 けいと','見本 こはる','見本 さくや','見本 しずく'];
function seedResponses(){
  const ex = SEED_TOPICS[0].example, ws = [1,0.75,0.75,0.75,0.5,0.5,0.5,0.75,0.25,0.25,0.75,0];
  return NAMES.map((n, i) => {
    const w = ws[i], opts = ex.options.map(o => Object.assign({}, o));
    const best = bestUnderWeight(opts, w).best[0];
    const chosen = (i === 7) ? 2 : best;
    return { responseId:'T1:s' + i, topicId:'T1', email:'s' + i + '@example.com', classCode:'1-1', seat:String(i + 1), name:n,
      options:opts, user:['自分','自分','弟','自分','自分','友だち','自分','自分','母','自分','自分','自分'][i],
      situation:'通学', weight:w, chosen:chosen,
      reason: chosen !== best ? '点では別の案だが、見た目がいやだとかぶらなくなるので' : '重く見た方の点が高い案にした',
      idea: i % 3 === 0 ? '穴の位置を工夫する' : '', status: i < 10 ? '提出' : '書きかけ', updatedAt:'2026-11-08 10:' + String(10 + i) };
  });
}

/* ===== [S8b] 開発モードの見本（技術の課題と、生徒の開発。実名は使わない） ===== */
const SEED_PROJECTS = [
  { projectId:'P1', title:'生活の困りごとを解決する木製品', open:true, classCode:'',
    desc:'自分や家族の生活の中から困りごとを見つけ、木材で解決する製品を設計・製作する。',
    constraints:'材料：杉板1枚（12×180×900mm）／製作：8時間／工具：両刃のこぎり・かんな・ボール盤・紙やすり',
    candidates:['安全性','機能性','使いやすさ','丈夫さ','見た目','材料の少なさ','製作のしやすさ','環境への負荷の少なさ'] },
  { projectId:'P2', title:'学校生活を良くする計測・制御のしくみ', open:true, classCode:'',
    desc:'学校生活の中の困りごとを、センサーで計測し、プログラムで制御して解決するしくみを考える。',
    constraints:'デバイス：1人1台（センサーは1つまで）／電源：電池／製作：6時間',
    candidates:['正確さ','反応の速さ','電池のもち','使いやすさ','安全性','プライバシー','費用の少なさ'] }
];
function seedDevs(){
  const o3 = a => a.map(v => ({ name:v[0], note:v[1], x:v[2], y:v[3], whyX:'', whyY:'' }));
  const base = (i, o) => Object.assign({ devId:'P1:s' + i, projectId:'P1', email:'s' + i + '@example.com', classCode:'1-1', seat:String(i + 1), name:NAMES[i],
    user:'', scene:'', ideal:'', now:'', axisX:'', axisY:'', conflict:'', goalX:'', goalY:'', options:[{name:'',note:''},{name:'',note:''}],
    weight:null, chosen:null, reason:'', task:'', cycles:[], status:'書きかけ', updatedAt:'2026-11-08 09:' + String(10 + i) }, o);
  return [
    base(0, { user:'祖母', scene:'台所で調味料を取るとき', ideal:'見たいびんがすぐ取れる', now:'奥のびんを取ろうとして、手前のびんを倒してしまう',
      axisX:'安全性', axisY:'機能性', conflict:'たくさん入れようと段を高くすると倒れやすくなり、上の段に手をのばすのも危なくなる',
      goalX:'中身を入れて10°かたむけても倒れない', goalY:'びんが8本入る',
      options:o3([['3段の縦長ラック','高さ45cm',2,5],['2段のひな段','高さ25cm・前を低く',4,4],['1段のトレー','高さ8cm',5,2]]), weight:0.75, chosen:1,
      reason:'祖母が使うので倒れないことを重く見た。ひな段なら後ろのびんも見える',

const DEV_STEPS = ['課題を読む','だれの困りごと？','トレードオフを決める','案を比べる','課題を決める','開発の記録'];

/** 段ごとの「済」。SPEC §9.2 */
function devDone(i, d){
  d = d || S.d; const named = d.options.filter(o => o.name && o.name.trim());
  if (i === 1) return !!(d.user.trim() && (d.now.trim() || d.ideal.trim()));
  if (i === 2) return !!(d.axisX && d.axisY && d.axisX !== d.axisY && d.conflict.trim());
  if (i === 3) return named.length >= 2 && named.every(o => o.x && o.y);
  if (i === 4) return d.weight !== null && d.chosen !== null && !!d.task.trim();
  if (i === 5) return d.cycles.length > 0;
  return false;
}
function devStageKey(d){ for (let i = 1; i <= 4; i++) if (!devDone(i, d)) return i; return 5; }
function devStage(d){ const k = devStageKey(d); return k < 5 ? DEV_STEPS[k] : (d.cycles.length ? '開発中（版' + d.cycles.length + '）' : '開発の記録'); }

      L.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { if (confirm(MARK[+b.dataset.del] + ' の案を消しますか？')) {
        d.options.splice(+b.dataset.del, 1); if (d.chosen !== null && d.chosen >= d.options.length) d.chosen = null; devTouch(); devStep(); } });
      add.onclick = () => { d.options.push({ name:'', note:'' }); devTouch(); devStep(); };
    }
  }
  if (S.dstep === 4) {
    if (!devDone(3)) { L.innerHTML = gate(3, '先に「案を比べる」で、案を2つ以上出して点をつけてください。'); Rt.innerHTML = ''; }
    else {
      const bw = d.weight === null ? null : bestUnderWeight(d.options, d.weight);
      const diff = bw && d.chosen !== null && !bw.best.includes(d.chosen);
      const list = d.options.map((o,i) => ({o,i})).filter(v => v.o.name && v.o.name.trim());
      L.innerHTML = `<div class="panel"><h3>4　課題を決める</h3>
        <div class="field"><span>${esc(d.user)}が${esc(d.scene || 'その場面')}で使うなら、どちらを重く見る？</span>
          <div class="weights">${weightLabels(ax).map(x => `<button data-w="${x.w}" class="${d.weight === x.w ? 'on' : ''}">${esc(x.t)}</button>`).join('')}</div></div>
        <div class="bestmsg">${bw ? (bw.best.length ? 'いまの重みでいちばん点が高いのは <b>' + bw.best.map(i => MARK[i] + ' ' + esc(d.options[i].name)).join('、') + '</b>' + (bw.best.length > 1 ? '（同点）' : '') : '') : '重みを選ぶと、いちばん点が高い案が出ます。'}</div>
        <div class="field"><span>つくる案（点が高い案でなくてもよい）</span><div class="choose">${list.map(({o,i}) => `<label class="${d.chosen === i ? 'on' : ''}"><input type="radio" name="dch" value="${i}" ${d.chosen === i ? 'checked' : ''}>${MARK[i]} ${esc(o.name)}</label>`).join('')}</div></div>
        ${tf('dr', diff ? '<b>点がいちばん高い案とちがう案にした理由</b>' : '選んだ理由（使う人・場面とつなげて）', d.reason, '', true)}
        <div class="field"><span>課題文（何のために、どこで折り合って、何をつくるか）</span>
          <button class="quiet" id="compose" style="margin-bottom:6px">下書きを組み立てる</button>
          <textarea id="dt" style="min-height:96px" placeholder="「下書きを組み立てる」を押すと、ここまで書いたことから下書きができます。自分の言葉に直そう。">${esc(d.task)}</textarea></div>
        <ul class="checks" id="checks"></ul>${nav(null)}</div>`;
      Rt.innerHTML = viewPanel(ax, d.options, d.weight) + `<div class="panel">${goalBox}</div>`;
      const drawChecks = () => { checks.innerHTML = taskChecks(d).map(c => `<li class="${c[1] ? 'y' : 'n'}">${c[1] ? '○' : '―'} ${c[0]}</li>`).join(''); };
      drawChecks();
      L.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { d.weight = +b.dataset.w; devTouch(); devStep(); });
      L.querySelectorAll('input[name=dch]').forEach(el => el.onchange = () => { d.chosen = +el.value; devTouch(); devStep(); });
      dr.oninput = () => { d.reason = dr.value; devTouch(); };
      dt.oninput = () => { d.task = dt.value; devTouch(); drawChecks(); };
      compose.onclick = () => { if (d.task.trim() && !confirm('いま書いてある課題文を、組み立てた下書きで置きかえますか？')) return;
        d.task = composeTask(d); dt.value = d.task; devTouch(); drawChecks(); };
    }
  }
  if (S.dstep === 5) {
    if (!devDone(4)) { L.innerHTML = gate(4, '試作の前に課題を決めます。先に「課題を決める」で課題文を書いてください。'); Rt.innerHTML = ''; }
    else {
      L.innerHTML = `<div class="panel"><h3>5　開発の記録</h3>
        <p class="lead">試作・製作のたびに1つ記録しよう。目標に近づいたか、片方を上げてもう片方を下げていないかを見ます。</p>
        <div class="taskbox">${esc(d.task)}</div>${goalBox}
        <div style="margin-top:10px">${d.cycles.map((v,i) => `<div class="cycle"><div style="display:flex;gap:10px;align-items:center"><b>版${i + 1}</b>
            <input type="date" data-c="${i}" data-k="date" value="${esc(v.date)}" style="width:auto">
            <button class="quiet" data-cdel="${i}" style="margin-left:auto">この版を消す</button></div>
          ${`<label class="field"><span>つくった・直したこと</span><input data-c="${i}" data-k="what" value="${esc(v.what)}" placeholder="例：段ボールで試作して、びんを並べた"></label>`}
          <div class="row"><span class="tx">いまの${esc(d.axisX)}</span><div class="score sx">${[1,2,3,4,5].map(n => `<button data-cs="${i}" data-a="x" data-v="${n}" class="${v.x === n ? 'on' : ''}">${n}</button>`).join('')}</div><span></span></div>
          <div class="row"><span class="ty">いまの${esc(d.axisY)}</span><div class="score sy">${[1,2,3,4,5].map(n => `<button data-cs="${i}" data-a="y" data-v="${n}" class="${v.y === n ? 'on' : ''}">${n}</button>`).join('')}</div><span></span></div>
          <label class="field"><span>確かめた結果（目標と比べて）</span><textarea data-c="${i}" data-k="result" placeholder="例：倒れなかったが、びんが6本しか入らない">${esc(v.result)}</textarea></label>
          <label class="field"><span>次に直すこと</span><input data-c="${i}" data-k="next" value="${esc(v.next)}" placeholder="例：段の奥行きを2cm広げる"></label></div>`).join('')}</div>
        <button class="quiet" id="addc" ${d.cycles.length >= 20 ? 'disabled' : ''}>＋ 版を足す（試作・製作のたびに。20まで）</button>
        <div class="nav"><button class="quiet" data-go="4">← もどる</button><span></span></div></div>`;
      Rt.innerHTML = `<div class="panel"><h3>計画からの動き</h3>${viewSVGMap(ax, [], null, { path: devPath(d) })}
        <p class="muted" style="margin:6px 0 0">点線の丸＝計画（選んだ案）。黒い丸＝版ごとの「いまの点」。右上に向かっていれば両方が良くなっている。片方だけ動いていたら、もう片方が下がっていないか見よう。</p></div>`;
      L.querySelectorAll('[data-c]').forEach(el => el.oninput = () => { d.cycles[+el.dataset.c][el.dataset.k] = el.value; devTouch(); });
      L.querySelectorAll('[data-cs]').forEach(b => b.onclick = () => { d.cycles[+b.dataset.cs][b.dataset.a] = +b.dataset.v; devTouch(); devStep(); });
      L.querySelectorAll('[data-cdel]').forEach(b => b.onclick = () => { if (confirm('版' + (+b.dataset.cdel + 1) + ' の記録を消しますか？消すと元にもどせません。')) { d.cycles.splice(+b.dataset.cdel, 1); devTouch(); devStep(); } });
      addc.onclick = () => { d.cycles.push({ date: stamp().slice(0, 10), what:'', x:null, y:null, result:'', next:'' }); devTouch(); devStep(); };
    }
  }
  document.querySelectorAll('#left [data-go]').forEach(b => b.onclick = () => { S.dstep = Math.max(0, Math.min(5, +b.dataset.go)); render(); });
}

/* --- 先生：開発モード --- */
async function teacherDevHome(){
  const res = await Api.teacherProjects(); S.t.projects = res.projects || [];
  if (!S.t.psel && S.t.projects.length) S.t.psel = S.t.projects[0].projectId;
  S.t.devs = S.t.psel ? ((await Api.teacherDevs(S.t.psel)).devs || []) : [];
  const p = S.t.projects.find(x => x.projectId === S.t.psel);
  app.innerHTML = modeTabs() + `<div class="tgrid"><div class="tlist"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h2 style="font-size:16px">技術の課題</h2><button class="quiet" id="newp">＋ つくる</button></div>
      ${S.t.projects.map(x => `<button data-pp="${esc(x.projectId)}" class="${x.projectId === S.t.psel ? 'on' : ''}"><b>${esc(x.title)}</b>${x.open ? '' : ' <span class="tag">配っていない</span>'}<br>
        <span class="muted">課題を提出 ${x.fixed}・書いている人 ${x.total}</span></button>`).join('')}</div><div id="tmain"></div></div>`;
  app.querySelectorAll('[data-pp]').forEach(b => b.onclick = () => { S.t.psel = b.dataset.pp; teacherDevHome(); });
  newp.onclick = () => projectEditor(null);
  if (p) teacherProject(p);
}
function teacherProject(p){
  const ds = S.t.devs, fixed = ds.filter(d => d.status === '課題提出'), logged = ds.filter(d => d.cycles.length);
  const pairs = {}; ds.filter(d => d.axisX && d.axisY).forEach(d => { const k = d.axisX + ' × ' + d.axisY; pairs[k] = (pairs[k] || 0) + 1; });
  const pl = Object.entries(pairs).sort((a,b) => b[1] - a[1]), mx = Math.max(1, ...pl.map(x => x[1]));
  const stages = DEV_STEPS.slice(1).map((n, i) => [n, ds.filter(d => devStageKey(d) === i + 1).length]);
  const sorted = ds.slice().sort((a,b) => (a.classCode + a.seat.padStart(3,'0')).localeCompare(b.classCode + b.seat.padStart(3,'0')));
  tmain.innerHTML = `<div class="panel"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="font-size:18px">${esc(p.title)}</h2><span class="tag">開発</span>
      <button class="quiet" id="edp" style="margin-left:auto">課題を直す</button></div>
      <p class="muted" style="margin:4px 0">${esc(p.desc)}</p><div class="constraint" style="margin:6px 0"><b>条件</b>　${esc(p.constraints)}</div>
      <div class="kpis"><span>課題を提出 <b>${fixed.length}</b></span><span>書きかけ <b>${ds.length - fixed.length}</b></span><span>開発の記録あり <b>${logged.length}</b></span></div></div>
    <div class="cls" style="margin-top:12px"><div class="panel"><h3>選んだトレードオフ（X × Y）</h3>
        ${pl.length ? pl.map(([k,n]) => `<div class="pair"><span>${esc(k)}</span><div class="pbar"><div style="width:${n / mx * 100}%"></div></div><b>${n}人</b></div>`).join('') : '<p class="muted">まだだれも選んでいません</p>'}
        <p class="muted" style="margin:6px 0 0">同じ課題でも、人によってぶつかり合う視点がちがう。授業で紹介する組み合わせを選ぶときに。</p>
        <h3 style="margin-top:14px">いまの段</h3>${stages.map(([n,c]) => `<div class="pair"><span>${esc(n)}</span><div class="pbar"><div style="width:${ds.length ? c / ds.length * 100 : 0}%"></div></div><b>${c}人</b></div>`).join('')}</div>
      <div class="panel" style="overflow-x:auto"><h3>一覧（行を押すと全部見られます）</h3><table class="tbl"><tr><th>組-番</th><th>名前</th><th>使う人</th><th>トレードオフ</th><th>課題文</th><th>版</th><th>いまの段</th></tr>
        ${sorted.map(d => `<tr class="click" data-dv="${esc(d.devId)}"><td>${esc(d.classCode)}-${esc(d.seat)}</td><td>${esc(d.name)}</td><td>${esc(d.user)}</td>
          <td>${d.axisX ? `<span class="tx">${esc(d.axisX)}</span> × <span class="ty">${esc(d.axisY)}</span>` : '-'}</td>
          <td>${esc(d.task.length > 50 ? d.task.slice(0, 50) + '…' : d.task)}</td><td>${d.cycles.length}</td><td>${esc(devStage(d))}</td></tr>`).join('')}</table></div></div>`;
  edp.onclick = () => projectEditor(p);
  tmain.querySelectorAll('[data-dv]').forEach(tr => tr.onclick = () => showDev(p, ds.find(x => x.devId === tr.dataset.dv)));
}
function showDev(p, d){
  const ax = devAx(d);
  drawer.innerHTML = `<div class="drawer"><div><button class="quiet close" id="dc">とじる</button><h3 style="font-size:17px">${esc(d.classCode)}-${esc(d.seat)} ${esc(d.name)}</h3>
    <p class="muted">${esc(d.status)}・${esc(d.updatedAt)}・いま：${esc(devStage(d))}</p>
    <h3 style="margin-top:10px">1 だれの困りごと</h3><p style="margin:4px 0">${esc(d.user)}／${esc(d.scene)}<br><b>理想：</b>${esc(d.ideal)}<br><b>現状：</b>${esc(d.now)}</p>
    <h3 style="margin-top:10px">2 トレードオフ</h3><p style="margin:4px 0"><span class="tx">${esc(ax.axisX)}</span> × <span class="ty">${esc(ax.axisY)}</span><br>${esc(d.conflict)}<br>
      <b>目標：</b>${esc(d.goalX)}／${esc(d.goalY)}</p>
    <h3 style="margin-top:10px">3・4 案と課題</h3>${viewTable(ax, d.options, d.weight)}
    <p style="margin:6px 0"><b>重み：</b>${esc(wText(ax, d.weight))}　<b>理由：</b>${esc(d.reason)}</p><div class="taskbox">${esc(d.task) || '（まだ）'}</div>
    <h3 style="margin-top:10px">5 開発の記録</h3>${d.cycles.length ? d.cycles.map((v,i) => `<p style="margin:4px 0"><b>版${i + 1}</b>（${esc(v.date)}）${esc(v.what)}<br>
      <span class="tx">${esc(ax.axisX)} ${v.x || '-'}</span>・<span class="ty">${esc(ax.axisY)} ${v.y || '-'}</span>　${esc(v.result)}<br><span class="muted">次：${esc(v.next)}</span></p>`).join('') +
      viewSVGMap(ax, [], null, { path: devPath(d) }) : '<p class="muted">まだありません</p>'}</div></div>`;
  dc.onclick = () => drawer.innerHTML = ''; drawer.firstChild.onclick = ev => { if (ev.target === drawer.firstChild) drawer.innerHTML = ''; };
}
function projectEditor(p){
  p = p || { title:'', desc:'', constraints:'', candidates:['安全性','機能性','使いやすさ','丈夫さ','見た目','材料の少なさ','製作のしやすさ','環境への負荷の少なさ'], classCode:'', open:true };
  drawer.innerHTML = `<div class="drawer"><div><button class="quiet close" id="dc">とじる</button><h3 style="font-size:17px">${p.projectId ? '課題を直す' : '技術の課題をつくる'}</h3>
    <div class="form2" style="margin-top:10px">
      <label class="field wide"><span>課題の名前</span><input id="q1" value="${esc(p.title)}" placeholder="例：生活の困りごとを解決する木製品"></label>
      <label class="field wide"><span>課題の説明</span><textarea id="q2">${esc(p.desc)}</textarea></label>
      <label class="field wide"><span>条件（材料・時間・工具・使える部品）</span><textarea id="q3">${esc(p.constraints)}</textarea></label>
      <label class="field wide"><span>視点の候補（「、」で区切る。生徒はここから2つ選ぶか、自分で書く）</span><input id="q4" value="${esc((p.candidates || []).join('、'))}"></label>
      <label class="field"><span>配るクラス（空なら全員）</span><input id="q5" value="${esc(p.classCode)}" placeholder="1-1"></label>
      <label class="field" style="display:flex;gap:8px;align-items:center;margin-top:28px"><input type="checkbox" id="q6" style="width:auto" ${p.open ? 'checked' : ''}> 生徒に配る</label></div>
    <div class="nav"><span></span><button class="main" id="qs">保存する</button></div></div></div>`;
  dc.onclick = () => drawer.innerHTML = '';
  qs.onclick = async () => {
    const cands = q4.value.split(/[、,，\n]+/).map(x => x.trim()).filter(Boolean);
    if (!q1.value.trim() || cands.length < 2) { alert('課題の名前と、視点の候補を2つ以上書いてください'); return; }
    const np = { projectId:p.projectId, title:q1.value.trim(), desc:q2.value.trim(), constraints:q3.value.trim(), candidates:cands, classCode:q5.value.trim(), open:q6.checked };
    const res = await Api.saveProject(np); drawer.innerHTML = ''; S.t.psel = res.projectId; teacherDevHome(); };
}

/* ===== [S14b] 先生の画面に入る（パスワード。本番だけ。タブを閉じると出たことになる） ===== */
const TOKEN_KEY = 'oriai.teacher';
function loadTeacherToken(){ try { S.t.token = sessionStorage.getItem(TOKEN_KEY) || ''; } catch(e){ S.t.token = ''; } return S.t.token; }
function setTeacher(token){
  S.t.token = token || '';
  try { if (token) sessionStorage.setItem(TOKEN_KEY, token); else sessionStorage.removeItem(TOKEN_KEY); } catch(e){}
  S.role = token ? 'teacher' : 'student'; S.screen = 'home'; S.t.sel = null; S.t.psel = null;
}
function showLogin(){
  drawer.innerHTML = `<div class="drawer"><div><button class="quiet close" id="dc" type="button">とじる</button><h3 style="font-size:17px">先生の画面に入る</h3>
    <form id="lf" style="margin-top:12px"><label class="field"><span>パスワード</span><input id="lp" type="password" autocomplete="off"></label>
      <p id="lm" style="color:var(--y);font-size:14px;margin:8px 0 0" role="status"></p>
      <div class="nav"><span></span><button class="main" id="ls" type="submit">入る</button></div></form></div></div>`;
  dc.onclick = () => drawer.innerHTML = '';
  drawer.firstChild.onclick = ev => { if (ev.target === drawer.firstChild) drawer.innerHTML = ''; };
  lp.focus();
  lf.onsubmit = async ev => {
    ev.preventDefault();
    if (!lp.value.trim()) { lm.textContent = 'パスワードを入れてください。'; return; }
    ls.disabled = true; lm.textContent = '確かめています…';
    const r = await Api.teacherLogin(lp.value);
    GasApi.failShown = false; notice('');
    if (r.success) { setTeacher(r.token); render(); return; }
    if (!document.getElementById('lm')) return;
    lm.textContent = r.message; ls.disabled = false; lp.value = ''; lp.focus();
  };
}

/* ===== [S15] 描画の入口・デモ切替 ===== */
function render(){
  document.querySelectorAll('#demo [data-role]').forEach(b => b.classList.toggle('on', b.dataset.role === S.role));
  document.querySelectorAll('#demo [data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === S.view));
  document.getElementById('teacherBtn').textContent = S.role === 'teacher' ? '先生の画面を出る' : '先生の方はこちら';
  drawer.innerHTML = '';
  flushSave();
  if (S.role === 'teacher') return S.mode === 'dev' ? teacherDevHome() : teacherHome();
  if (S.screen === 'work') return studentWork();
  if (S.screen === 'dev') return devWork();
  return S.mode === 'dev' ? studentDevHome() : studentHome();
}
document.querySelectorAll('#demo [data-role]').forEach(b => b.onclick = () => { S.role = b.dataset.role; render(); });
document.querySelectorAll('#demo [data-view]').forEach(b => b.onclick = () => { S.view = b.dataset.view; try { localStorage.setItem('oriai.view', S.view); } catch(e){}
  if (S.role === 'student' && S.screen === 'work') { render(); } else render(); });
document.querySelector('#demo [data-reset]').onclick = async () => { if (!confirm('見本データを入れ直します。この端末で書いたものは消えます。')) return;
  await MockApi.reset(); S.screen = 'home'; S.t.sel = null; S.t.psel = null; render(); };
if (IS_GAS) {
  document.body.classList.add('gas');
  document.querySelector('header.app .logo small').textContent = '2つの視点で検討する';
  teacherBtn.onclick = () => { if (S.role === 'teacher') { setTeacher(''); render(); } else showLogin(); };
}
app.innerHTML = '<p class="muted">読み込み中…</p>';
if (IS_GAS && /OX_ROLE_NOUSER$/.test(ROLE_MARK)) {
  app.innerHTML = '<div class="panel"><h3>アカウントを確認できませんでした</h3><p class="lead">学校の Google アカウントで開いてください。ほかのアカウントでもログインしているときは、シークレットウィンドウで開き直してください。</p></div>';
  teacherBtn.remove();
} else {
  if (IS_GAS && loadTeacherToken()) S.role = 'teacher';
  render();
}
</script>
</body>
